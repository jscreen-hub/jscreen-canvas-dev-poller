# Local Canvas lab-billing poller.
# Runs on this machine: authenticates to Canvas, polls the FHIR DiagnosticReport
# endpoint for lab results a provider has signed off (committed Lab Results
# Review), resolves the order behind each result, and writes an enriched billing
# JSON file to a local directory. Not a Canvas plugin.
#
# Sibling of ../order-poller, which polls committed lab ORDERS. This one polls
# signed-off lab RESULTS and compiles the billing packet for them.

[project]
name = "billing-poller"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["billing_poller"]
omit = ["tests/*", "*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
omit = ["tests/*", "*/tests/*"]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
